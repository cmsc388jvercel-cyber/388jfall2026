<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>388J chat</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; margin-bottom: .5rem; }
    .system { color: #888; font-style: italic; }
    .announce { background: #fdf3d0; padding: 2px 6px; }
    input { padding: .4rem; }
  </style>
</head>
<body>
  <h2>388J chat <small id="count"></small></h2>
  <div id="log"></div>
  <form id="form">
    <input id="text" autocomplete="off" placeholder="say something" size="50">
    <button>Send</button>
  </form>
  <script src="/static/socket.io.min.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
