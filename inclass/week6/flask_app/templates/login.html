{% extends "base.html" %}
{% block content %}
  <h1>Log in</h1>
  <form method="POST">
    {{ form.hidden_tag() }}
    {% for field in [form.username, form.password] %}
      <div>
        {{ field.label }}<br>{{ field() }}
        {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    {{ form.submit() }}
  </form>
{% endblock %}
