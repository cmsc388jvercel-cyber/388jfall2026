<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ config["SITE_NAME"] }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; font-size: 20px; }
    nav a { margin-right: 16px; }
    .flash { background: #fdf3d0; padding: 8px 12px; border-radius: 4px; }
    .error { color: #b00020; font-size: 16px; }
    input { font-size: 18px; margin: 4px 0 8px 0; }
    img.avatar { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('main.index') }}">Home</a>
    <a href="{{ url_for('main.about') }}">About</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('users.account') }}">Account</a>
      <a href="{{ url_for('users.logout') }}">Log out ({{ current_user.username }})</a>
    {% else %}
      <a href="{{ url_for('users.register') }}">Register</a>
      <a href="{{ url_for('users.login') }}">Log in</a>
    {% endif %}
  </nav>
  <hr>
  {% for message in get_flashed_messages() %}
    <p class="flash">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
